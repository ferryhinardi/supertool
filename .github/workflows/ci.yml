name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint & Type Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9.15.3

      - name: Approve build scripts for ffmpeg-static
        run: |
          echo "Approving ffmpeg-static build scripts..."
          pnpm config set enable-pre-post-scripts true
          pnpm approve-builds ffmpeg-static || true

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run ESLint
        run: pnpm lint
        continue-on-error: true

      - name: Debug - Show vitest config
        run: cat vitest.config.mts | head -25

      - name: Clean TypeScript cache
        run: rm -f tsconfig.tsbuildinfo

      - name: Type check
        run: pnpm exec tsc --noEmit

  test:
    name: Unit & Integration Tests (Shard ${{ matrix.shard }})
    runs-on: ubuntu-latest
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9.15.3

      - name: Approve build scripts for ffmpeg-static
        run: |
          echo "Approving ffmpeg-static build scripts..."
          pnpm config set enable-pre-post-scripts true
          pnpm approve-builds ffmpeg-static || true

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      - name: Run unit tests with coverage (Shard ${{ matrix.shard }}/4)
        run: pnpm exec vitest run --shard=${{ matrix.shard }}/4 --coverage.enabled=true
        env:
          CI: true

      - name: Upload coverage reports
        uses: codecov/codecov-action@v4
        if: always()
        with:
          files: ./coverage/coverage-final.json,./coverage/lcov.info
          flags: unittests
          name: ci-coverage
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false
          flags: shard-${{ matrix.shard }}
          verbose: true

      - name: Upload test screenshots (on failure)
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: test-screenshots-shard-${{ matrix.shard }}
          path: |
            components/ui/__tests__/__screenshots__/
            components/features/__tests__/__screenshots__/
            app/**/__tests__/__screenshots__/
          retention-days: 7

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: lint

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9.15.3

      - name: Approve build scripts for ffmpeg-static
        run: |
          echo "Approving ffmpeg-static build scripts..."
          pnpm config set enable-pre-post-scripts true
          pnpm approve-builds ffmpeg-static || true

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build project
        run: pnpm build
        env:
          # Use secrets if available, otherwise use placeholder for build
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL || 'https://placeholder.supabase.co' }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY || 'placeholder-anon-key' }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY || 'sk-placeholder-key-for-build' }}

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: build
          path: |
            .next/standalone/
            .next/static/
            .next/*.json
            public/
          retention-days: 7
          if-no-files-found: warn
