name: Test Coverage

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: write
  pull-requests: write

jobs:
  coverage:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9.15.3

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Approve build scripts for ffmpeg-static
        run: |
          echo "Approving ffmpeg-static build scripts..."
          pnpm config set enable-pre-post-scripts true
          pnpm approve-builds ffmpeg-static || true

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm exec playwright install chromium --with-deps

      - name: Run tests with coverage
        timeout-minutes: 20
        run: |
          timeout 900 pnpm exec vitest run --coverage || {
            exit_code=$?
            if [ $exit_code -eq 124 ] && [ -f coverage/coverage-final.json ] && [ -f coverage/coverage-summary.json ] && [ -f coverage/lcov.info ]; then
              echo "::warning::Vitest was killed by timeout after coverage artifacts were generated"
              exit 0
            fi
            exit $exit_code
          }
        env:
          CI: true
          NODE_ENV: test
          NODE_OPTIONS: --max-old-space-size=16384

      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v4
        with:
          file: ./coverage/coverage-final.json
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: false
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

      - name: Comment coverage on PR
        if: github.event_name == 'pull_request'
        uses: romeovs/lcov-reporter-action@v0.3.1
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          lcov-file: ./coverage/lcov.info
          delete-old-comments: true

      - name: Check coverage threshold
        run: |
          COVERAGE=$(cat coverage/coverage-summary.json | jq '.total.lines.pct')
          echo "Current coverage: $COVERAGE%"
          
          if (( $(echo "$COVERAGE < 25" | bc -l) )); then
            echo "❌ Coverage is below 25% threshold"
            echo "Current: $COVERAGE%"
            echo "Required: 25%"
            exit 1
          else
            echo "✅ Coverage meets 25% threshold"
          fi

      - name: Store coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/
          retention-days: 30

      - name: Update README with coverage badge
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          # Update README with coverage percentage
          COVERAGE=$(cat coverage/coverage-summary.json | jq '.total.lines.pct')
          COVERAGE_INT=$(printf "%.0f" $COVERAGE)
          
          # Determine badge color
          if (( $(echo "$COVERAGE >= 80" | bc -l) )); then
            COLOR="brightgreen"
          elif (( $(echo "$COVERAGE >= 50" | bc -l) )); then
            COLOR="yellow"
          else
            COLOR="orange"
          fi
          
          # Create coverage badge URL
          BADGE_URL="https://img.shields.io/badge/coverage-${COVERAGE_INT}%25-${COLOR}"
          
          # Update README if badge placeholder exists
          if grep -q "!\[Coverage\]" README.md; then
            sed -i "s|!\[Coverage\](.*)|![Coverage](${BADGE_URL})|g" README.md
          else
            # Add badge to README
            sed -i "1s|^|![Coverage](${BADGE_URL})\n\n|" README.md
          fi
          
          # Commit and push if changes exist
          if [[ $(git status --porcelain README.md) ]]; then
            git config --local user.email "github-actions[bot]@users.noreply.github.com"
            git config --local user.name "github-actions[bot]"
            git add README.md
            git commit -m "docs: update coverage badge to ${COVERAGE_INT}%"
            git push
          fi
