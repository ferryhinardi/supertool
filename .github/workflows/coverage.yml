name: Test Coverage

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

# Cancel in-progress runs for the same branch
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write

env:
  NODE_VERSION: '20'
  PNPM_VERSION: '9.15.3'

jobs:
  coverage-shard:
    name: Coverage (Shard ${{ matrix.shard }}/4)
    runs-on: ubuntu-latest
    # Coverage shards are non-blocking — their purpose is to produce
    # coverage artifacts, not to gate the PR on test results (CI shards
    # already do that).
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Approve build scripts for ffmpeg-static
        run: |
          pnpm config set enable-pre-post-scripts true
          pnpm approve-builds ffmpeg-static || true

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            playwright-${{ runner.os }}-

      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm exec playwright install --with-deps chromium

      - name: Install Playwright dependencies (cached)
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: pnpm exec playwright install-deps chromium

      - name: Run tests with coverage (Shard ${{ matrix.shard }}/4)
        timeout-minutes: 15
        run: |
          pnpm exec vitest run \
            --shard=${{ matrix.shard }}/4 \
            --coverage \
            --reporter=blob \
            --passWithNoTests || true
        env:
          CI: true
          NODE_ENV: test
          NODE_OPTIONS: --max-old-space-size=8192

      - name: Upload blob report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vitest-blob-shard-${{ matrix.shard }}
          path: .vitest-reports/
          retention-days: 1
          if-no-files-found: ignore

  coverage-report:
    name: Merge Coverage
    runs-on: ubuntu-latest
    needs: coverage-shard
    if: ${{ !cancelled() }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Approve build scripts for ffmpeg-static
        run: |
          pnpm config set enable-pre-post-scripts true
          pnpm approve-builds ffmpeg-static || true

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Download all blob reports
        uses: actions/download-artifact@v4
        with:
          pattern: vitest-blob-shard-*
          path: .vitest-reports
          merge-multiple: true

      - name: Merge reports and generate coverage
        timeout-minutes: 10
        run: |
          pnpm exec vitest --merge-reports --coverage
        env:
          CI: true
          NODE_ENV: test

      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v4
        with:
          file: ./coverage/coverage-final.json
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: false
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

      - name: Comment coverage on PR
        if: github.event_name == 'pull_request'
        uses: romeovs/lcov-reporter-action@v0.3.1
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          lcov-file: ./coverage/lcov.info
          delete-old-comments: true

      - name: Check coverage threshold
        run: |
          COVERAGE=$(cat coverage/coverage-summary.json | jq '.total.lines.pct')
          echo "Current coverage: $COVERAGE%"
          
          if (( $(echo "$COVERAGE < 25" | bc -l) )); then
            echo "❌ Coverage is below 25% threshold"
            echo "Current: $COVERAGE%"
            echo "Required: 25%"
            exit 1
          else
            echo "✅ Coverage meets 25% threshold"
          fi

      - name: Store coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/
          retention-days: 30

      - name: Update README with coverage badge
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          # Update README with coverage percentage
          COVERAGE=$(cat coverage/coverage-summary.json | jq '.total.lines.pct')
          COVERAGE_INT=$(printf "%.0f" $COVERAGE)
          
          # Determine badge color
          if (( $(echo "$COVERAGE >= 80" | bc -l) )); then
            COLOR="brightgreen"
          elif (( $(echo "$COVERAGE >= 50" | bc -l) )); then
            COLOR="yellow"
          else
            COLOR="orange"
          fi
          
          # Create coverage badge URL
          BADGE_URL="https://img.shields.io/badge/coverage-${COVERAGE_INT}%25-${COLOR}"
          
          # Update README if badge placeholder exists
          if grep -q "!\[Coverage\]" README.md; then
            sed -i "s|!\[Coverage\](.*)|![Coverage](${BADGE_URL})|g" README.md
          else
            # Add badge to README
            sed -i "1s|^|![Coverage](${BADGE_URL})\n\n|" README.md
          fi
          
          # Commit and push if changes exist
          if [[ $(git status --porcelain README.md) ]]; then
            git config --local user.email "github-actions[bot]@users.noreply.github.com"
            git config --local user.name "github-actions[bot]"
            git add README.md
            git commit -m "docs: update coverage badge to ${COVERAGE_INT}%"
            git push
          fi
