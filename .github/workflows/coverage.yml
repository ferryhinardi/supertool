name: Test Coverage

on:
  push:
    branches:
      - main
    paths:
      - 'app/**'
      - 'components/**'
      - 'lib/**'
      - 'hooks/**'
      - 'tests/**'
      - 'vitest*.mts'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'codecov.yml'
      - '.github/workflows/coverage.yml'
      - 'README.md'
  workflow_dispatch: # Manual trigger retained for coverage debugging and recovery runs

permissions:
  contents: write
  pull-requests: write

jobs:
  coverage:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4 # pnpm version is read from package.json#packageManager

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Approve build scripts for ffmpeg-static
        run: |
          echo "Approving ffmpeg-static build scripts..."
          pnpm config set enable-pre-post-scripts true
          pnpm approve-builds ffmpeg-static || true

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm exec playwright install chromium --with-deps

      - name: Run tests with coverage
        timeout-minutes: 20
        run: |
          timeout 1200 pnpm exec vitest run --config vitest.coverage.config.mts --coverage || {
            exit_code=$?

            if [ "$exit_code" -eq 124 ] && [ -f coverage/coverage-summary.json ] && [ -f coverage/coverage-final.json ] && [ -f coverage/lcov.info ]; then
              echo "::warning::Vitest coverage run hit timeout after writing coverage artifacts"
              exit 0
            fi

            exit "$exit_code"
          }
        env:
          CI: true
          NODE_ENV: test
          NODE_OPTIONS: --max-old-space-size=16384

      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@b9fd7d16f6d7d1b5d2bec1a2887e65ceed900238 # v4
        with:
          file: ./coverage/coverage-final.json
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: true
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

      - name: Comment coverage on PR
        if: github.event_name == 'pull_request'
        uses: romeovs/lcov-reporter-action@dda1c9b1fa1622b225e9acd87a248751dbcc6ada # v0.3.1
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          lcov-file: ./coverage/lcov.info
          delete-old-comments: true

      - name: Check coverage threshold
        run: |
          COVERAGE=$(cat coverage/coverage-summary.json | jq '.total.lines.pct')
          echo "Current coverage: $COVERAGE%"
          
          if (( $(echo "$COVERAGE < 25" | bc -l) )); then
            echo "❌ Coverage is below 25% threshold"
            echo "Current: $COVERAGE%"
            echo "Required: 25%"
            exit 1
          else
            echo "✅ Coverage meets 25% threshold"
          fi

      - name: Store coverage report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: coverage-report
          path: coverage/
          retention-days: 30
