coverage:
  status:
    project:
      default:
        target: auto
        threshold: 1%  # Allow up to 1% coverage decrease
        informational: true  # Don't fail CI if coverage decreases slightly
    patch:
      default:
        target: auto
        threshold: 1%
        informational: true

comment:
  layout: "reach,diff,flags,tree"
  behavior: default
  require_changes: false
